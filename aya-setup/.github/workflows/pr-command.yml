# PR Command: Claude sessions and auto-merge for PRs managed in the PR Command app.
# The logic lives in univelop/.github; this file only wires up the triggers.
name: PR Command

on:
  # "Agent" button in the app: fire the repo's claude.ai routine.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      instruction:
        description: What the Claude session should do
        required: true
  # "Mergeable" button in the app adds the ready-to-merge label.
  pull_request:
    types: [labeled]
  # Re-check queued PRs when CI finishes. List this repo's CI workflow names here.
  workflow_run:
    workflows: ['CI', 'Visual Regression']
    types: [completed]
  # The base branch moved: queued PRs may now be behind or conflicting.
  push:
    branches: [main]
  # Fallback for anything the events above miss.
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read
  statuses: read
  id-token: write

jobs:
  session:
    if: github.event_name == 'workflow_dispatch'
    uses: univelop/.github/.github/workflows/pr-command-session.yml@main
    with:
      pr: ${{ inputs.pr }}
      instruction: ${{ inputs.instruction }}
      # Who may start sessions. They run on the subscription of the routine's owner.
      allowed_users: 'CLNMR'
    secrets: inherit

  merge:
    if: >-
      github.event_name == 'schedule' || github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ready-to-merge')
    concurrency:
      group: pr-command-merge-${{ github.repository }}
    uses: univelop/.github/.github/workflows/pr-command-merge.yml@main
    with:
      pr: ${{ format('{0}', github.event.pull_request.number || '') }}
      merge_method: squash
      # Whose PRs the merge agent may work on. It runs on the CLAUDE_CODE_OAUTH_TOKEN owner's subscription.
      allowed_users: 'CLNMR'
      # Checks that only a human can satisfy (review gates). The merge agent ignores them.
      human_checks: ''
    secrets: inherit
