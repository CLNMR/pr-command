# Starts a Claude Code session in claude.ai/code on a PR branch by firing the routine of the
# person who clicked "Agent", then posts the session link on the PR (read back by the PR Command app).
#
# One secret per person (repo or org level): CLAUDE_ROUTINE_<LOGIN>, where <LOGIN> is the GitHub
# login in upper case with "-" replaced by "_". Value: {"id": "trig_…", "token": "sk-ant-oat01-…"}.
# The session runs in that person's claude.ai account, so there is deliberately no shared fallback.
name: PR Command – session

on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      instruction:
        type: string
        required: true
      allowed_users:
        description: Comma-separated GitHub logins allowed to start sessions (each runs in their own claude.ai account)
        type: string
        required: true

jobs:
  fire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fire routine
        env:
          GH_TOKEN: ${{ github.token }}
          # Secrets can't be looked up by a computed name in an expression, so pick the person's
          # routine out of the secrets context below. Every secret value stays masked in the log.
          SECRETS_JSON: ${{ toJSON(secrets) }}
          PR: ${{ inputs.pr }}
          INSTRUCTION: ${{ inputs.instruction }}
          ALLOWED_USERS: ${{ inputs.allowed_users }}
          ACTOR: ${{ github.triggering_actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          fail() {
            printf '<!-- pr-command:session-error -->\n%s\n\n[Workflow run](%s)\n' "$1" "$RUN_URL" \
              | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
            echo "::error::$1"
            exit 1
          }

          [[ "$PR" =~ ^[0-9]+$ ]] || fail "Invalid PR number"
          [[ ",${ALLOWED_USERS// /}," == *",$ACTOR,"* ]] || fail "@$ACTOR is not allowed to start Claude sessions in this repo."
          secret_name="CLAUDE_ROUTINE_$(tr 'a-z-' 'A-Z_' <<<"$ACTOR")"
          routine=$(jq -c --arg k "$secret_name" '.[$k] // empty | fromjson? // empty' <<<"$SECRETS_JSON" 2>/dev/null || true)
          [ -n "$routine" ] || fail "@$ACTOR has no Claude routine set up yet: the secret $secret_name is missing or not valid JSON. See SETUP-COLLEAGUES.md in the PR Command repo."
          routine_id=$(jq -r '.id // empty' <<<"$routine")
          routine_token=$(jq -r '.token // empty' <<<"$routine")
          [ -n "$routine_id" ] && [ -n "$routine_token" ] || fail "The secret $secret_name needs both \"id\" and \"token\"."
          echo "::add-mask::$routine_token"

          pr_json=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,url,headRefName,baseRefName,state)
          [ "$(jq -r .state <<<"$pr_json")" = "OPEN" ] || fail "PR #$PR is not open."

          text=$(jq -r --arg repo "$GITHUB_REPOSITORY" --arg actor "$ACTOR" --arg instruction "$INSTRUCTION" '
            "Repository: \($repo)\n" +
            "Pull request: #\(.url | split("/") | last) – \(.title)\n" +
            "URL: \(.url)\n" +
            "Head branch: \(.headRefName)\n" +
            "Base branch: \(.baseRefName)\n" +
            "Requested by: @\($actor) via PR Command\n\n" +
            "Instruction:\n\($instruction)"' <<<"$pr_json")

          body=$(jq -n --arg text "$text" '{text: $text}')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${routine_id}/fire" \
            -H "Authorization: Bearer ${routine_token}" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$body")
          status=$(tail -n1 <<<"$response")
          payload=$(sed '$d' <<<"$response")
          [[ "$status" =~ ^2 ]] || fail "Routine fire failed with HTTP $status: $(head -c 500 <<<"$payload")"

          url=$(jq -r '.claude_code_session_url // empty' <<<"$payload")
          [ -n "$url" ] || fail "Routine fire returned no session URL: $(head -c 500 <<<"$payload")"
          marker=$(jq -cn --arg url "$url" '{url: $url}')

          {
            printf '<!-- pr-command:session %s -->\n' "$marker"
            printf '🤖 **Claude session started** by @%s – [open in claude.ai/code](%s)\n\n' "$ACTOR" "$url"
            printf '<details><summary>Instruction</summary>\n\n'
            sed 's/^/> /' <<<"$INSTRUCTION"
            printf '\n</details>\n'
          } | gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file -
          echo "Session: $url" >> "$GITHUB_STEP_SUMMARY"
